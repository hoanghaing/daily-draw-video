name: daily

on:
  schedule:
    - cron: "30 23 * * *" # 06:30 Vietnam
    - cron: "30 2 * * *" # 09:30 Vietnam, backup: a day that is done exits at once
  workflow_dispatch:
    inputs:
      date:
        description: "Vietnam day YYYY-MM-DD (empty = today)"
        required: false
      dry_run:
        description: "Render and send, but change no state"
        type: boolean
        default: false

concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser libraries for Remotion
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2
      - name: Render and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY" = "true" ]; then args+=(--dry-run); fi
          pnpm exec tsx daily/run.ts "${args[@]}"
      - name: Record the day
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "daily-video-bot"
          git config user.email "daily-video-bot@users.noreply.github.com"
          git add content/log.json content/knowledge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record $(date -u +%F) [skip ci]"
          git pull --rebase
          git push
      - name: Tell the channel it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Video hôm nay chưa gửi được. Xem lần chạy: ${RUN_URL}" > /dev/null
